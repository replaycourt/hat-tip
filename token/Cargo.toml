[package]
name = "tusd"
description = "tUSD: a fixed-supply NEP-141 test dollar for the Hat Tip demo; no owner, no mint"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-parameters = "0.38.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
